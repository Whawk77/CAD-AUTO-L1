name: cad-nightly

on:
  schedule:
    # 18:00 UTC is approximately 02:00 the next day in Asia/Taipei.
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: cad-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cad-nightly:
    runs-on: [self-hosted, Windows, X64, autocad-2020]
    timeout-minutes: 180
    env:
      CONFIGURED_CORE_CONSOLE_PATH: ${{ vars.AUTOCAD_CORE_CONSOLE_PATH }}
      CONFIGURED_AUTOCAD_PROFILE: ${{ vars.AUTOCAD_PROFILE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight runner and regression assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pwshCommand = Get-Command pwsh -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $pwshCommand -or -not (Test-Path -LiteralPath $pwshCommand.Source -PathType Leaf)) {
            throw "PowerShell 7 executable (pwsh) was not found on the runner."
          }
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "PowerShell 7+ is required; found $($PSVersionTable.PSVersion)."
          }
          "Using pwsh $($PSVersionTable.PSVersion) at $($pwshCommand.Source)"
          $coreConsolePath = $env:CONFIGURED_CORE_CONSOLE_PATH
          if ([string]::IsNullOrWhiteSpace($coreConsolePath)) {
            $coreConsolePath = "D:\Program Files\Autodesk\AutoCAD 2020\accoreconsole.exe"
          }
          if (-not (Test-Path -LiteralPath $coreConsolePath -PathType Leaf)) {
            throw "AutoCAD Core Console was not found: $coreConsolePath"
          }

          $profile = $env:CONFIGURED_AUTOCAD_PROFILE
          if ([string]::IsNullOrWhiteSpace($profile)) {
            $profile = "1"
          }

          $activeCoreConsoles = @(Get-Process -Name "accoreconsole" -ErrorAction SilentlyContinue)
          if ($activeCoreConsoles.Count -gt 0) {
            $pids = ($activeCoreConsoles | ForEach-Object { $_.Id }) -join ", "
            throw "Close active AutoCAD Core Console process(es) before nightly regression. PID(s): $pids"
          }

          if (-not (Test-Path -LiteralPath ".\scripts\run-cad-regression-suite.ps1" -PathType Leaf)) {
            throw "Regression suite entry point is missing: scripts\run-cad-regression-suite.ps1"
          }

          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate-remediation-matrix.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Remediation matrix validation failed with exit code $LASTEXITCODE."
          }
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\validate-regression-manifests.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Regression manifest validation failed with exit code $LASTEXITCODE."
          }

          "CAD_CORE_CONSOLE_PATH=$coreConsolePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAD_PROFILE=$profile" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run deterministic CAD regression suite
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\scripts\run-cad-regression-suite.ps1 `
            -Build `
            -RepeatCount 3 `
            -CoreConsolePath "$env:CAD_CORE_CONSOLE_PATH" `
            -Profile "$env:CAD_PROFILE" `
            -TimeoutSeconds 180
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Validate nightly summary contract
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runsRoot = Join-Path (Get-Location) "regression\nightly\runs"
          if (-not (Test-Path -LiteralPath $runsRoot -PathType Container)) {
            throw "Nightly runs directory was not found: $runsRoot"
          }

          $latestSummary = @(Get-ChildItem -LiteralPath $runsRoot -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {
              $candidate = Join-Path $_.FullName "summary.json"
              if (Test-Path -LiteralPath $candidate -PathType Leaf) { Get-Item -LiteralPath $candidate }
            } |
            Sort-Object LastWriteTimeUtc |
            Select-Object -Last 1)
          if ($latestSummary.Count -ne 1) {
            throw "Expected exactly one latest nightly summary.json, found $($latestSummary.Count)."
          }

          $summary = Get-Content -Raw -Encoding UTF8 -LiteralPath $latestSummary[0].FullName | ConvertFrom-Json
          if ([string]$summary.status -ne "Passed") {
            throw "Nightly summary status is '$($summary.status)', expected 'Passed'."
          }
          if ($summary.PSObject.Properties.Name -notcontains "errors" -or @($summary.errors).Count -ne 0) {
            throw "Nightly summary contains $(@($summary.errors).Count) error(s)."
          }
          if ($summary.PSObject.Properties.Name -notcontains "cases" -or @($summary.cases).Count -eq 0) {
            throw "Nightly summary has no case records."
          }
          $determinism = @($summary.visualInspection.determinism)
          if ($determinism.Count -eq 0 -or @($determinism | Where-Object { $_.deterministic -ne $true }).Count -gt 0) {
            throw "Nightly visual determinism contract failed."
          }

          $dllHashesPath = Join-Path $latestSummary[0].DirectoryName "dll-hashes.json"
          if (-not (Test-Path -LiteralPath $dllHashesPath -PathType Leaf)) {
            throw "Nightly DLL hash evidence was not found: $dllHashesPath"
          }
          $dllHashes = @(Get-Content -Raw -Encoding UTF8 -LiteralPath $dllHashesPath | ConvertFrom-Json)
          if ($dllHashes.Count -lt 3) {
            throw "Nightly DLL hash evidence has $($dllHashes.Count) item(s), expected at least 3."
          }
          "Validated nightly summary contract: $($latestSummary[0].FullName); cases=$(@($summary.cases).Count); dlls=$($dllHashes.Count)"

      - name: Publish nightly summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $summaryFiles = @(Get-ChildItem -Path ".\regression\nightly\runs" -Recurse -File -Include "summary.md", "summary.json", "dll-hashes.json" -ErrorAction SilentlyContinue | Sort-Object FullName)
          if ($summaryFiles.Count -eq 0) {
            "## CAD nightly evidence" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            "No nightly summary was generated; inspect the uploaded trace and runner logs." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            exit 0
          }

          "## CAD nightly evidence" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          foreach ($summaryFile in $summaryFiles) {
            "### $($summaryFile.FullName.Substring((Get-Location).Path.Length + 1))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if ($summaryFile.Name -eq "summary.md") {
              Get-Content -LiteralPath $summaryFile.FullName -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
            else {
              '```json' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              Get-Content -LiteralPath $summaryFile.FullName -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
              '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }

      - name: Upload nightly evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cad-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          # Archive the complete run tree so failure diagnosis retains every generated artifact.
          path: regression/nightly/runs/**
          if-no-files-found: warn
          retention-days: 30
